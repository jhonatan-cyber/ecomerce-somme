allowBuilds:
  sharp: true
  esbuild: false
  unrs-resolver: false

# Los scripts no reinstalan solos antes de correr (el chequeo aborta sin TTY
# en este entorno y en CI ya hay un paso explícito de install --frozen).
verifyDepsBeforeRun: false

# pnpm 9/10: los overrides viven aquí, no en package.json ("pnpm" field ignorado).
overrides:
  "@babel/core@<=7.29.0": "^7.29.6"
  "brace-expansion@<1.1.17": "^1.1.17"
  "brace-expansion@>=2.0.0 <2.1.3": "^2.1.3"
  "fast-uri@>=3.0.0 <3.1.6": "^3.1.6"
  "nanoid@<3.3.18": "^3.3.18"
  "browserslist@<=4.28.6": "^4.28.7"
  "form-data@>=4.0.0 <4.0.6": "^4.0.6"
  "postcss@<=8.5.17": "^8.5.18"
  "serialize-javascript@<=7.0.2": "^7.0.3"
  "sharp@<0.35.0": "^0.35.0"
  "vite@<=6.4.2": "^6.4.3"
  "ws@>=8.0.0 <8.21.0": "^8.21.0"
