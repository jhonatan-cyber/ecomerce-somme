name: Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Lint client/server boundary
        run: pnpm lint:boundary

      - name: Lint JS/TS
        run: pnpm lint:js

      - name: Type check
        run: pnpm type-check

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://sommetechnology.com' }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_STORE_API_URL: ${{ vars.NEXT_PUBLIC_STORE_API_URL }}
          NEXT_PUBLIC_UPLOADS_URL: ${{ vars.NEXT_PUBLIC_UPLOADS_URL }}
          NEXT_PUBLIC_WHATSAPP_NUMBER: ${{ vars.NEXT_PUBLIC_WHATSAPP_NUMBER }}
          NEXT_PUBLIC_PUSHER_KEY: ${{ vars.NEXT_PUBLIC_PUSHER_KEY }}
          NEXT_PUBLIC_PUSHER_CLUSTER: ${{ vars.NEXT_PUBLIC_PUSHER_CLUSTER || 'us2' }}

      - name: Deploy to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: ".next/*,public/*,package.json,pnpm-lock.yaml,pnpm-workspace.yaml,next.config.mjs"
          target: "/var/www/ecomerce-somme"
          strip_components: 0

      - name: Remote install & restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /var/www/ecomerce-somme
            umask 077
            # Rollback: conservar el build anterior por si el healthcheck falla.
            rm -rf .next.prev
            [ -d .next ] && cp -a .next .next.prev
            printf '%s\n' \
              "NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'https://sommetechnology.com' }}" \
              "NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}" \
              "NEXT_PUBLIC_STORE_API_URL=${{ vars.NEXT_PUBLIC_STORE_API_URL }}" \
              "NEXT_PUBLIC_UPLOADS_URL=${{ vars.NEXT_PUBLIC_UPLOADS_URL }}" \
              "NEXT_PUBLIC_WHATSAPP_NUMBER=${{ vars.NEXT_PUBLIC_WHATSAPP_NUMBER }}" \
              "NEXT_PUBLIC_PUSHER_KEY=${{ vars.NEXT_PUBLIC_PUSHER_KEY }}" \
              "NEXT_PUBLIC_PUSHER_CLUSTER=${{ vars.NEXT_PUBLIC_PUSHER_CLUSTER || 'us2' }}" \
              > .env
            chmod 600 .env
            pnpm install --prod --frozen-lockfile
            pm2 reload ecomerce-somme --update-env || pm2 start node_modules/.bin/next --name ecomerce-somme -- start -p 3000
            sleep 10
            if curl -fsS http://localhost:3000/api/health > /dev/null; then
              echo "Healthcheck OK"
              rm -rf .next.prev
            else
              echo "Healthcheck FAILED: restaurando build anterior"
              rm -rf .next
              [ -d .next.prev ] && mv .next.prev .next
              pm2 reload ecomerce-somme --update-env || pm2 start node_modules/.bin/next --name ecomerce-somme -- start -p 3000
              exit 1
            fi
